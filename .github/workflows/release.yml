name: Release

# Tag the release named by the top heading in CHANGELOG.md.
#
# The app has no build step and deploys by pushing to main, so there is nothing
# to publish here: a release is just the identity of what is already live. This
# workflow exists so that identity is a git tag rather than a value someone has
# to remember to copy into sw.js.
#
# The changelog heading is the only input. It is parsed once, in one step, so
# the tag and the release notes cannot disagree about which release this is.
#
# Idempotent by design: if the tag already exists it does nothing, so re-running
# after a docs-only edit, or replaying a promotion, is safe.

on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
  # Escape hatch: lets the tag be created by hand if the push run was missed or
  # failed. Takes no inputs; it re-reads CHANGELOG.md exactly like a push would.
  workflow_dispatch:

# Least privilege: read the repo, and write the tag/release. Nothing else.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # One parse of one file. The version is the first heading whose bracket
      # content looks like CalVer, which skips `## [Unreleased]`. Anything else
      # fails loudly rather than tagging a typo, and the notes come from the
      # same heading so the two cannot drift apart.
      - name: Resolve the release and its notes
        id: release
        run: |
          heading="$(grep -m1 -E '^## \[[0-9]{4}\.[0-9]{2}(\.[0-9]+)?\]' CHANGELOG.md || true)"

          if [ -z "$heading" ]; then
            echo "No CalVer release heading in CHANGELOG.md; nothing to tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$(printf '%s' "$heading" | sed -E 's/^## \[([^]]+)\].*/\1/')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag"

          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release section for $tag is empty." >&2
            exit 1
          fi

      - name: Skip when the tag already exists
        id: exists
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # gh creates the tag and the release together, so there is no window where
      # a tag exists without a release.
      - name: Create tag and release
        if: steps.release.outputs.skip != 'true' && steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "The Stylus $TAG" \
            --notes-file release-notes.md
